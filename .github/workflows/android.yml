name: Android test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/lowstim-android"
          downloads="$RUNNER_TEMP/lowstim-sdk-downloads"
          mkdir -p "$downloads" "$sdk/platforms" "$sdk/build-tools" "$sdk/ndk" "$sdk/cmake/3.22.1"
          fetch() {
            curl --fail --silent --show-error --location --retry 3 "https://dl.google.com/android/repository/$1" -o "$downloads/$1"
            printf '%s  %s\n' "$2" "$downloads/$1" | sha1sum --check
          }
          fetch platform-35_r02.zip 0bb560a90a7a2cbd0dd8348224d518b638fe7949 & platform_pid=$!
          fetch build-tools_r35_linux.zip 2cfaa0bbb2336e9ec18ed3ecea84fa2e2af607bc & tools_pid=$!
          fetch android-ndk-r27c-linux.zip 090e8083a715fdb1a3e402d0763c388abb03fb4e & ndk_pid=$!
          fetch cmake-3.22.1-linux.zip fd0a48b4a758310df8c7aa51f59840ed48fe7ed8 & cmake_pid=$!
          for pid in "$platform_pid" "$tools_pid" "$ndk_pid" "$cmake_pid"; do wait "$pid"; done
          unzip -q "$downloads/platform-35_r02.zip" -d "$sdk/platforms"
          unzip -q "$downloads/build-tools_r35_linux.zip" -d "$sdk/build-tools"
          mv "$sdk/build-tools/android-15" "$sdk/build-tools/35.0.0"
          unzip -q "$downloads/android-ndk-r27c-linux.zip" -d "$sdk/ndk"
          mv "$sdk/ndk/android-ndk-r27c" "$sdk/ndk/27.2.12479018"
          unzip -q "$downloads/cmake-3.22.1-linux.zip" -d "$sdk/cmake/3.22.1"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Build and sign a test APK
        env:
          FORGE_KEYSTORE: ${{ runner.temp }}/test.keystore
          FORGE_KEYSTORE_PASSWORD: android
          LLAMA_SOURCE: ${{ runner.temp }}/llama
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export FORGE_BUILD_DIR="$RUNNER_TEMP/build"
          mkdir -p "$LLAMA_SOURCE"
          curl --fail --location --retry 3 https://codeload.github.com/ggml-org/llama.cpp/tar.gz/refs/tags/b6348 | tar -xz --strip-components=1 -C "$LLAMA_SOURCE"
          keytool -genkeypair -keystore "$FORGE_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=LowStim Test'
          android/build-apk.sh "$RUNNER_TEMP/LowStim.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LowStim-ARM64
          path: ${{ runner.temp }}/LowStim.apk
          if-no-files-found: error

  release:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LowStim-ARM64
      - name: Publish the first phone-test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "The v0.2.0 release already exists."
          else
            gh release create v0.2.0 LowStim.apk --target "$GITHUB_SHA" --prerelease --title "LowStim v0.2.0" --notes "Signed ARM64 test build for Android 12 or later. Follow the README to import Qwen for offline AI planning."
          fi
          assets="$(gh release view v0.2.0 --json assets --jq '.assets[].name')"
          if ! grep -Fxq 'LowStim-Android.zip' <<< "$assets"; then
            archive_dir="$(mktemp -d)"
            trap 'rm -rf "$archive_dir"' EXIT
            gh release download v0.2.0 --pattern 'LowStim.apk' --dir "$archive_dir"
            unzip -tq "$archive_dir/LowStim.apk"
            (cd "$archive_dir" && zip -9q LowStim-Android.zip LowStim.apk)
            unzip -tq "$archive_dir/LowStim-Android.zip"
            gh release upload v0.2.0 "$archive_dir/LowStim-Android.zip"
          fi
